# gin-vue-admin 后台管理脚手架配置
# 说明：没有 MySQL / Redis 时把 enable 置为 false，服务会以内置演示账号模式启动（admin / 123456）
system:
  env: debug        # debug | release | test
  addr: :8888       # 后端监听地址，前端 vite 代理指向该端口
  prefix: /api      # 统一路由前缀

jwt:
  signing-key: radish-go
  expires-time: 24h
  issuer: radish-go

mysql:
  enable: false     # true 时连接真实 MySQL；false 时使用演示账号
  host: 127.0.0.1
  port: 3306
  username: root
  password: root
  dbname: radish_gva

redis:
  enable: false
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0

zap:
  level: info       # debug | info | warn | error
  format: console   # console | json
  prefix: '[radish-gva]'
  director: logs
  show-line: true
  stacktrace: error
